<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#161208"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glowG2" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff9100" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#ff6d00" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trailerG2" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#2a2e38"/>
      <stop offset="50%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="metalG2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="650" fill="url(#bgG2)" rx="16"/>
  <circle cx="600" cy="300" r="420" fill="url(#glowG2)"/>

  <!-- High-Tech Industrial Grid -->
  <g stroke="#ff9100" stroke-opacity="0.1" stroke-width="1.5">
    <line x1="80" y1="520" x2="1120" y2="520"/>
    <line x1="30" y1="550" x2="1170" y2="550"/>
    <line x1="0" y1="590" x2="1200" y2="590"/>
    <line x1="250" y1="480" x2="100" y2="650"/>
    <line x1="450" y1="480" x2="350" y2="650"/>
    <line x1="650" y1="480" x2="650" y2="650"/>
    <line x1="850" y1="480" x2="950" y2="650"/>
    <line x1="1050" y1="480" x2="1180" y2="650"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="600" cy="520" rx="480" ry="26" fill="#000000" opacity="0.8"/>
  <ellipse cx="600" cy="516" rx="400" ry="10" fill="#ff9100" opacity="0.25"/>

  <!-- Facchini Semitrailer Heavy Body -->
  <!-- Trailer Chassis Beam -->
  <rect x="180" y="440" width="840" height="24" rx="4" fill="url(#metalG2)" stroke="#ff9100" stroke-width="1.5"/>

  <!-- Furgon / Cargo Structure -->
  <rect x="190" y="240" width="810" height="200" rx="6" fill="#181e2b" stroke="#334155" stroke-width="2"/>
  
  <!-- Facchini Aesthetic Stripes -->
  <path d="M 190 330 L 1000 330 L 1000 370 L 190 370 Z" fill="url(#trailerG2)"/>
  <line x1="190" y1="375" x2="1000" y2="375" stroke="#ffffff" stroke-width="3" stroke-dasharray="16, 12"/>

  <!-- Structural Ribs -->
  <g stroke="#283548" stroke-width="2">
    <line x1="280" y1="240" x2="280" y2="440"/>
    <line x1="370" y1="240" x2="370" y2="440"/>
    <line x1="460" y1="240" x2="460" y2="440"/>
    <line x1="550" y1="240" x2="550" y2="440"/>
    <line x1="640" y1="240" x2="640" y2="440"/>
    <line x1="730" y1="240" x2="730" y2="440"/>
    <line x1="820" y1="240" x2="820" y2="440"/>
    <line x1="910" y1="240" x2="910" y2="440"/>
  </g>

  <!-- Facchini High Performance Logo Text -->
  <text x="595" y="358" font-family="'Rajdhani', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="8" text-anchor="middle">FACCHINI · BRASIL & PERÚ</text>

  <!-- Landing Gear (Front) -->
  <rect x="880" y="464" width="16" height="50" fill="#475569"/>
  <rect x="872" y="506" width="32" height="8" rx="2" fill="#ff9100"/>

  <!-- Triple Axle Suspension System (3 Ejes) -->
  <!-- Axle 1 -->
  <circle cx="280" cy="485" r="46" fill="#0b0f19" stroke="#ff9100" stroke-width="3.5"/>
  <circle cx="280" cy="485" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="280" cy="485" r="10" fill="#ff9100"/>
  <!-- Axle 2 -->
  <circle cx="390" cy="485" r="46" fill="#0b0f19" stroke="#ff9100" stroke-width="3.5"/>
  <circle cx="390" cy="485" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="390" cy="485" r="10" fill="#ff9100"/>
  <!-- Axle 3 -->
  <circle cx="500" cy="485" r="46" fill="#0b0f19" stroke="#ff9100" stroke-width="3.5"/>
  <circle cx="500" cy="485" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="500" cy="485" r="10" fill="#ff9100"/>

  <!-- Side Reflective Lights -->
  <circle cx="210" cy="448" r="4" fill="#ff9100" filter="drop-shadow(0 0 6px #ff9100)"/>
  <circle cx="450" cy="448" r="4" fill="#ff9100" filter="drop-shadow(0 0 6px #ff9100)"/>
  <circle cx="700" cy="448" r="4" fill="#ff9100" filter="drop-shadow(0 0 6px #ff9100)"/>
  <circle cx="970" cy="448" r="4" fill="#ff9100" filter="drop-shadow(0 0 6px #ff9100)"/>

  <!-- Branding Badge & HUD Accents -->
  <text x="600" y="110" font-family="'Rajdhani', sans-serif" font-size="28" font-weight="700" fill="#ff9100" text-anchor="middle" letter-spacing="6">SEMIRREMOLQUES FACCHINI 3 EJES</text>
  <text x="600" y="145" font-family="'Montserrat', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="2">CARGA PESADA ULTRA ROBUSTA · CAPACIDAD 35 TONELADAS · ACERO ESTRUCTURAL</text>
  
  <rect x="520" y="170" width="160" height="28" rx="14" fill="rgba(255, 145, 0, 0.15)" stroke="#ff9100" stroke-width="1"/>
  <text x="600" y="188" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#ff9100" text-anchor="middle" letter-spacing="1">HOMOLOGADO MTC PERÚ</text>
</svg>
