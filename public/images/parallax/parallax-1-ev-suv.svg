<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a17"/>
      <stop offset="50%" stop-color="#0c1836"/>
      <stop offset="100%" stop-color="#020611"/>
    </linearGradient>
    <radialGradient id="glowG1" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050a17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carBodyG1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#1e3c72"/>
      <stop offset="100%" stop-color="#2a5298"/>
    </linearGradient>
    <linearGradient id="glassG1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0e9ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0b1b38" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="650" fill="url(#bgG1)" rx="16"/>
  <circle cx="600" cy="300" r="400" fill="url(#glowG1)"/>

  <!-- High-Tech Grid Floor -->
  <g stroke="#00f2fe" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="100" y1="520" x2="1100" y2="520"/>
    <line x1="50" y1="550" x2="1150" y2="550"/>
    <line x1="0" y1="590" x2="1200" y2="590"/>
    <line x1="300" y1="480" x2="100" y2="650"/>
    <line x1="450" y1="480" x2="350" y2="650"/>
    <line x1="600" y1="480" x2="600" y2="650"/>
    <line x1="750" y1="480" x2="850" y2="650"/>
    <line x1="900" y1="480" x2="1100" y2="650"/>
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="600" cy="510" rx="420" ry="28" fill="#000000" opacity="0.75"/>
  <ellipse cx="600" cy="508" rx="350" ry="12" fill="#00f2fe" opacity="0.3"/>

  <!-- SUV Car Silhouette / Body -->
  <!-- Underbody -->
  <path d="M 220 480 Q 600 495 980 480 L 970 450 Q 600 465 230 450 Z" fill="#0a1020"/>
  
  <!-- Main Body Silhouette -->
  <path d="M 230 445 C 240 400 290 380 370 375 L 490 320 C 560 260 740 250 820 310 L 920 350 C 970 370 985 410 970 450 C 900 455 300 455 230 445 Z" fill="url(#carBodyG1)"/>
  
  <!-- Aerodynamic Cabin & Windows -->
  <path d="M 505 320 L 795 310 C 815 340 865 350 870 355 L 430 355 C 460 335 485 325 505 320 Z" fill="url(#glassG1)"/>
  <line x1="640" y1="312" x2="635" y2="355" stroke="#00f2fe" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Cyber LED Headlights & DRL -->
  <path d="M 910 385 L 975 390 L 965 410 L 895 400 Z" fill="#00f2fe" filter="drop-shadow(0 0 12px #00f2fe)"/>
  <path d="M 225 395 L 260 395 L 255 412 L 220 410 Z" fill="#ff0055" filter="drop-shadow(0 0 8px #ff0055)"/>

  <!-- Cyber Contour Line -->
  <path d="M 250 420 Q 600 435 950 420" stroke="#00f2fe" stroke-width="3.5" fill="none" opacity="0.9"/>
  <path d="M 380 375 Q 600 370 820 365" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Wheels -->
  <!-- Rear Wheel -->
  <circle cx="370" cy="460" r="65" fill="#0d1424" stroke="#00f2fe" stroke-width="4"/>
  <circle cx="370" cy="460" r="42" fill="#1b2a47" stroke="#4facfe" stroke-width="2"/>
  <circle cx="370" cy="460" r="16" fill="#00f2fe"/>
  <!-- Front Wheel -->
  <circle cx="830" cy="460" r="65" fill="#0d1424" stroke="#00f2fe" stroke-width="4"/>
  <circle cx="830" cy="460" r="42" fill="#1b2a47" stroke="#4facfe" stroke-width="2"/>
  <circle cx="830" cy="460" r="16" fill="#00f2fe"/>

  <!-- Branding Badge & HUD Accents -->
  <text x="600" y="110" font-family="'Rajdhani', sans-serif" font-size="28" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="6">RODOPERU EV-600 INSIGNIA</text>
  <text x="600" y="145" font-family="'Montserrat', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="2">SUV 100% ELÉCTRICO · AUTONOMÍA 520 KM · BATERÍA LFP 82 kWh</text>
  
  <rect x="520" y="170" width="160" height="28" rx="14" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1"/>
  <text x="600" y="188" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#00f2fe" text-anchor="middle" letter-spacing="1">TECNOLOGÍA REVOLUCIONARIA</text>
</svg>
